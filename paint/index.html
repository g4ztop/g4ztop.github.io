<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shader Paint</title>

  <!-- PWA / iOS home-screen install -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#05060d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shader Paint">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --pad: env(safe-area-inset-bottom, 0px); }
    html, body {
      height: 100%;
      background: #05060d;
      overflow: hidden;
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #gl {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: block;
      touch-action: none;
    }

    /* ── Title ── */
    #title {
      position: fixed; top: calc(env(safe-area-inset-top,0px) + 14px); left: 18px;
      color: rgba(255,255,255,0.32);
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      pointer-events: none; transition: opacity .3s;
    }

    /* ── Control bar ── */
    #ui {
      position: fixed; left: 0; right: 0;
      bottom: calc(var(--pad) + 14px);
      display: flex; flex-direction: column; gap: 12px;
      padding: 0 14px;
      transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s;
    }
    body.immersive #ui { transform: translateY(160%); opacity: 0; pointer-events: none; }
    body.immersive #title { opacity: 0; }

    .row { display: flex; gap: 8px; align-items: center; }

    .modes { justify-content: center; flex-wrap: wrap; }
    .mode {
      -webkit-appearance: none; appearance: none; border: none;
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 9px 14px; border-radius: 999px;
      font-size: 12px; letter-spacing: 0.05em; font-weight: 600;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      cursor: pointer; transition: all .18s;
    }
    .mode.on {
      color: #fff; background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.4);
      box-shadow: 0 0 24px rgba(120,160,255,0.25);
    }

    .panel {
      display: flex; gap: 14px; align-items: center;
      background: rgba(12,14,24,0.55);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px; padding: 12px 16px;
    }
    .slider { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .slider label {
      font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 3px; border-radius: 3px;
      background: rgba(255,255,255,0.15); outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: var(--c, #fff); border: 2px solid rgba(255,255,255,0.9);
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    #hue { background: linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }

    .btn {
      -webkit-appearance: none; appearance: none;
      width: 46px; height: 46px; flex: 0 0 auto;
      border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(12,14,24,0.55);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      color: rgba(255,255,255,0.75); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn:active { background: rgba(255,255,255,0.16); }

    /* toast */
    #toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(.9);
      color: #fff; font-size: 15px; letter-spacing: 0.08em; font-weight: 600;
      padding: 10px 20px; border-radius: 14px;
      background: rgba(10,12,20,0.6);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    }
    #toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

    /* fallback */
    #nogl {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center; text-align: center;
      color: rgba(255,255,255,0.7); padding: 40px; font-size: 15px; line-height: 1.6;
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="title">Shader Paint</div>
  <div id="toast"></div>

  <div id="ui">
    <div class="row modes">
      <button class="mode on" data-mode="INK">Ink</button>
      <button class="mode" data-mode="SMOKE">Smoke</button>
      <button class="mode" data-mode="NEON">Neon</button>
      <button class="mode" data-mode="BIO">Bio</button>
      <button class="mode" data-mode="FIRE">Fire</button>
    </div>
    <div class="row">
      <div class="panel" style="flex:1">
        <div class="slider">
          <label>Color</label>
          <input type="range" id="hue" min="0" max="360" value="223">
        </div>
        <div class="slider">
          <label>Size</label>
          <input type="range" id="size" min="0" max="100" value="24">
        </div>
        <div class="slider">
          <label>Flow</label>
          <input type="range" id="flow" min="0" max="100" value="55">
        </div>
      </div>
      <button class="btn" id="clear" title="Clear">⌫</button>
      <button class="btn" id="save" title="Save PNG">↓</button>
      <button class="btn" id="hideBtn" title="Hide controls">⤢</button>
    </div>
  </div>

  <div id="nogl">
    Your browser can’t run WebGL2, which this app needs.<br>
    On iPhone, open this page in Safari and it should work.
  </div>

  <script src="app.js"></script>
</body>
</html>
