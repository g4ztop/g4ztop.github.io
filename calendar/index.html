<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>NYC / Calendar</title>
  <meta name="description" content="Weekly curated NYC calendar — lectures, Index NYC, Henry St, collectible furniture &amp; craft, Chelsea installations, and studio jewelry.">
  <meta property="og:title" content="NYC / Calendar">
  <meta property="og:description" content="Weekly curated NYC calendar — lectures, Index NYC, Henry St, collectible design, Chelsea, and handmade jewelry.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mitchellcraft.net/calendar/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%23efefef' stroke-width='2'/%3E%3Cline x1='3' y1='11' x2='29' y2='11' stroke='%23efefef' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-title-group">
        <div class="breadcrumb">
          <span class="crumb-muted">NYC</span>
          <span class="crumb-sep">/</span>
          <h1 class="crumb-current">Weekly Calendar</h1>
        </div>
        <div class="meta-line">
          <span id="updated-stamp">Loading…</span>
          <span class="dot">·</span>
          <a href="./data/calendar.ics" class="meta-link" download="nyc-curated-calendar.ics" title="Download or subscribe to iCalendar feed">+ .ics feed</a>
        </div>
      </div>

      <nav class="week-nav" aria-label="Week navigation">
        <button type="button" id="prev-week" class="nav-btn" aria-label="Previous week">←</button>
        <span id="week-range-label" class="week-label">—</span>
        <button type="button" id="next-week" class="nav-btn" aria-label="Next week">→</button>
        <button type="button" id="today-btn" class="nav-btn nav-btn-text">Today</button>
      </nav>
    </header>

    <section class="filter-bar" aria-label="Category filters">
      <div class="filter-scroll" id="category-filters"></div>
    </section>

    <nav class="mobile-day-strip" id="mobile-day-strip" aria-label="Jump to day"></nav>

    <main id="calendar-main">
      <section class="schedule-section" aria-labelledby="timed-heading">
        <div class="section-bar">
          <h2 id="timed-heading" class="section-title">Timed Events, Lectures &amp; Receptions</h2>
          <span id="timed-count" class="section-count">0 blocks</span>
        </div>
        <div id="week-grid" class="week-grid" role="region" aria-live="polite"></div>
      </section>

      <section class="onview-section" id="onview-section" aria-labelledby="onview-heading">
        <div class="section-bar">
          <h2 id="onview-heading" class="section-title">On View This Week — Exhibitions</h2>
          <button type="button" id="toggle-onview" class="section-toggle" aria-expanded="true">
            <span id="onview-count">0 blocks</span>
            <span id="onview-chevron" aria-hidden="true">−</span>
          </button>
        </div>
        <div id="onview-grid" class="onview-grid"></div>
      </section>
    </main>

    <footer class="footer">
      <span>Auto-maintained NYC index · Lectures, Index, Henry St, Design, Chelsea, Jewelry</span>
      <span id="window-note" class="footer-right">America/New_York</span>
    </footer>
  </div>

  <div id="detail-backdrop" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <div id="modal-kicker" class="modal-kicker"></div>
        <button type="button" id="modal-close" class="modal-close" aria-label="Close event details">×</button>
      </div>
      <h3 id="modal-title" class="modal-title"></h3>
      <div id="modal-venue" class="modal-venue"></div>
      <div id="modal-datetime" class="modal-datetime"></div>
      <p id="modal-blurb" class="modal-blurb"></p>
      <div id="modal-address-row" class="modal-address-row"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
