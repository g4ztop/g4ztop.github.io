name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MITCHELLCRAFT_NET }}'
          channelId: live
          projectId: mitchellcraft-net
          # Last successful CLI version; 15.34.1 adds a Service Usage permission check.
          firebaseToolsVersion: 15.34.0
