<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Mitchell Craft — Coming soon</title>
  <meta name="description" content="A new portfolio is on the way. Mitchell Craft — creative technology, AI and 3D. Find me on LinkedIn and Instagram.">
  <link rel="canonical" href="https://mitchellcraft.net/">
  <meta property="og:title" content="Mitchell Craft — Coming soon">
  <meta property="og:description" content="A new portfolio is on the way. In the meantime, find me on LinkedIn and Instagram.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mitchellcraft.net/">
  <meta name="twitter:card" content="summary">
  <style>
    * { box-sizing: border-box; }
    html { background: #080908; color: #f1f1eb; font-family: Helvetica, Arial, sans-serif; }
    body { margin: 0; }
    .page { max-width: 1520px; min-height: 100vh; min-height: 100svh; margin: 0 auto; padding: 0 clamp(24px, 5vw, 80px); display: grid; grid-template-rows: auto 1fr auto; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 32px 0; border-bottom: 1px solid #30342d; }
    .name { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: -.04em; }
    .discipline, .eyebrow, .footer { font-size: 11px; line-height: 1.6; letter-spacing: .08em; }
    .discipline { margin: 0; color: #a2aa9b; text-align: right; }
    main { padding: clamp(64px, 9vh, 110px) 0; align-self: center; }
    .eyebrow { margin: 0 0 28px; color: #a2aa9b; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(68px, 10.4vw, 154px); font-weight: 400; line-height: .98; letter-spacing: -.07em; }
    h1 span { color: #bdd8aa; }
    .intro { max-width: 410px; margin: 32px 0 28px; color: #afb4aa; font-size: 17px; line-height: 1.7; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    .links a { display: inline-flex; align-items: center; justify-content: space-between; gap: 40px; min-height: 52px; padding: 14px 20px; border: 1px solid #555e4c; border-radius: 3px; color: #f1f1eb; font-size: 14px; text-decoration: none; }
    .links a:hover { background: #bdd8aa; color: #080908; border-color: #bdd8aa; }
    .links a:focus-visible { outline: 2px solid #bdd8aa; outline-offset: 5px; }
    .footer { display: flex; justify-content: space-between; gap: 20px; padding: 24px 0; border-top: 1px solid #30342d; color: #a2aa9b; }
    .footer p { margin: 0; }
    @media (max-width: 600px) {
      .masthead { padding: 24px 0; align-items: flex-start; }
      .name { font-size: 20px; }
      .discipline { max-width: 130px; font-size: 10px; }
      main { padding: 64px 0; }
      h1 { font-size: clamp(54px, 12.9vw, 77px); }
      .intro { font-size: 15px; margin-top: 27px; }
      .links a { flex: 1; min-width: 125px; gap: 16px; }
      .footer { font-size: 9px; letter-spacing: .04em; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <p class="name">Mitchell Craft</p>
      <p class="discipline">Creative technology<br>AI &amp; 3D</p>
    </header>
    <main>
      <p class="eyebrow">Portfolio in progress</p>
      <h1>New work.<br><span>Coming soon.</span></h1>
      <p class="intro">I’m updating my portfolio. In the meantime, find me here.</p>
      <nav class="links" aria-label="Social profiles">
        <a href="https://www.linkedin.com/in/mitchell-c-1a5757141/" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">↗</span></a>
        <a href="https://www.instagram.com/murchellcruft/" target="_blank" rel="noopener noreferrer">Instagram <span aria-hidden="true">↗</span></a>
      </nav>
    </main>
    <footer class="footer">
      <p>New York, NY</p>
      <p>Mitchell Craft © 2026</p>
    </footer>
  </div>
</body>
</html>
